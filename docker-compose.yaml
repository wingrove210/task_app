services:
  identity:
    build:
      context: ./services
      dockerfile: ./identity/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_identity
      JWT_SECRET: dev-secret
      JWT_ALGORITHM: HS256
      SMTP_HOST: "${SMTP_HOST:-mailhog}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-no-reply@taskmanager.local}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Task Manager}"
    depends_on:
      - db
      - redis
      - rabbitmq
      - mailhog

  project:
    build:
      context: ./services
      dockerfile: ./project/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_project
      IDENTITY_SERVICE_URL: http://identity:8000
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: rabbitmq
      PROJECT_INVITE_BASE_URL: http://localhost:8002/projects/invitations/accept
      SMTP_HOST: "${SMTP_HOST:-mailhog}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-no-reply@taskmanager.local}"
    depends_on:
      - db
      - redis
      - rabbitmq
      - identity
      - mailhog

  task:
    build:
      context: ./services
      dockerfile: ./task/Dockerfile
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_task
      IDENTITY_SERVICE_URL: http://identity:8000
      PROJECT_SERVICE_URL: http://project:8000
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - db
      - redis
      - rabbitmq
      - identity
      - project

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  rabbitmq_data: