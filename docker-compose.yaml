services:
  identity:
    build:
      context: ./services
      dockerfile: ./identity/Dockerfile
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_identity
      JWT_SECRET: dev-secret
      JWT_ALGORITHM: HS256
      SMTP_HOST: "${SMTP_HOST:-mailhog}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-no-reply@taskmanager.local}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Task Manager}"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      mailhog:
        condition: service_started
    deploy:
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  project:
    build:
      context: ./services
      dockerfile: ./project/Dockerfile
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_project
      IDENTITY_SERVICE_URL: http://identity:8000
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: rabbitmq
      PROJECT_INVITE_BASE_URL: http://localhost:8002/projects/invitations/accept
      SMTP_HOST: "${SMTP_HOST:-mailhog}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-no-reply@taskmanager.local}"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      identity:
        condition: service_started
      mailhog:
        condition: service_started
    deploy:
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  task:
    build:
      context: ./services
      dockerfile: ./task/Dockerfile
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_task
      IDENTITY_SERVICE_URL: http://identity:8000
      PROJECT_SERVICE_URL: http://project:8000
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: rabbitmq
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      identity:
        condition: service_started
      project:
        condition: service_started
    deploy:
      replicas: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      identity:
        condition: service_healthy
      project:
        condition: service_healthy
      task:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - identity
      - project
      - task

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  rabbitmq_data:
  grafana_data: