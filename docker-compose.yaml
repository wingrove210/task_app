services:
  identity:
    build:
      context: ./services
      dockerfile: ./identity/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_identity
      JWT_SECRET: dev-secret
      JWT_ALGORITHM: HS256
    depends_on:
      - db
      - redis
      - rabbitmq

  project:
    build:
      context: ./services
      dockerfile: ./project/Dockerfile
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_project
      IDENTITY_SERVICE_URL: http://identity:8000
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - db
      - redis
      - rabbitmq
      - identity

  task:
    build:
      context: ./services
      dockerfile: ./task/Dockerfile
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/task_manager_task
      IDENTITY_SERVICE_URL: http://identity:8000
      PROJECT_SERVICE_URL: http://project:8000
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - db
      - redis
      - rabbitmq
      - identity
      - project

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data: