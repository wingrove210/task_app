resolver 127.0.0.11 ipv6=off valid=10s;

upstream identity_upstream {
    least_conn;
    zone identity_upstream 64k;
    server identity:8000 resolve;
}

upstream project_upstream {
    least_conn;
    zone project_upstream 64k;
    server project:8000 resolve;
}

upstream task_upstream {
    least_conn;
    zone task_upstream 64k;
    server task:8000 resolve;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /auth/ {
        proxy_pass http://identity_upstream;
    }

    location /internal/ {
        proxy_pass http://identity_upstream;
    }

    location = /projects {
        proxy_pass http://project_upstream/projects;
    }

    location = /projects/ {
        proxy_pass http://project_upstream/projects;
    }

    location /projects/ {
        proxy_pass http://project_upstream;
    }

    location /tasks/ {
        proxy_pass http://task_upstream;
    }

    location /health {
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://project_upstream;
    }
}
